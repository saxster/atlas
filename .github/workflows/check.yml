name: check
on:
  # Local CI only. Keep the lane definitions available to repository tooling.
  push:
    branches-ignore: ['**']
    tags-ignore: ['**']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run check
      - name: Every page, the controls, the machine, the explorer and the textbook adapter
        run: |
          python3 -m http.server 8137 >/dev/null 2>&1 &
          sleep 1
          npm run test:browser

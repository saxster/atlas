name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run check
      - name: Every page loads without errors
        env: { CHROME: /usr/bin/google-chrome }
        run: |
          python3 -m http.server 8137 >/dev/null 2>&1 &
          sleep 1
          node tools/allpages.mjs

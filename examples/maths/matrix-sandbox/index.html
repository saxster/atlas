<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The 2×2 Matrix Sandbox · Atlas of Mathematics</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../engine/atlas.css">
<link rel="stylesheet" href="../../../engine/figure.css">
<script type="importmap">
{ "imports": { "@saxster/atlas/adapters/": "../../../adapters/", "@saxster/atlas/": "../../../engine/", "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/" } }
</script>
</head>
<body class="fig-body">
  <header class="topbar">
    <a href="../" class="brand">Atlas of Mathematics</a>
    <span class="crumb">Fig. M.1 · Matrix sandbox</span>
    <span class="fill"></span>
    <a class="back" href="../../../">All subjects</a>
  </header>
  <main class="figpage sandbox">
    <aside class="side">
      <p class="question" id="question"></p>
      <section class="presets" id="presets"></section>
      <section class="matrix-box" id="matrix"></section>
      <section class="palette" id="palette"></section>
      <div class="controls" id="controls"></div>
      <button type="button" class="again" id="again">Reset matrix</button>
    </aside>
    <section class="figwrap" id="right">
      <div class="figure">
        <canvas id="gl" aria-label="An interactive 2×2 matrix sandbox where basis vectors Aî and Aĵ and custom probe vectors can be dragged on the 2D grid while the determinant parallelogram and eigenvector lines update live."></canvas>
        <div id="labels" aria-hidden="true"></div>
        <div class="corner tl" id="figno"></div>
        <div class="corner tr" id="figtitle"></div>
        <div class="speed" id="speed" hidden></div>
        <div class="corner br readout" id="readout"></div>
      </div>
      <div class="chips" id="chips"></div>
      <div class="chart" id="chart"></div>
      <p class="bigidea" id="bigidea"></p>
      <article class="plate" id="plate" hidden></article>
    </section>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
